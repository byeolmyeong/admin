# 올릴 때마다 타입 · 린트 · 테스트 · 빌드를 돌린다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 타입
        run: npx tsc --noEmit
      - name: 린트
        run: npm run lint
      - name: 테스트
        run: npm test
      - name: 빌드
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080
